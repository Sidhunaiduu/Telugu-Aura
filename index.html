<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --silver: #ededed;
  --muted: #999;
  --border: rgba(255,255,255,.14);
}

html {
  min-height: 100%;
  background: #070707;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at 50% 0%, #252525 0%, transparent 48%),
    radial-gradient(ellipse at 50% 100%, #191919 0%, transparent 45%),
    #070707;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    135deg,
    transparent 0,
    transparent 50px,
    rgba(255,255,255,.012) 51px,
    transparent 52px
  );
}

.card {
  position: relative;
  width: 100%;
  max-width: 390px;
  padding: 27px 22px 21px;
  text-align: center;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.21);
  border-radius: 26px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.012) 50%, rgba(255,255,255,.04)),
    #101010;
  box-shadow:
    0 25px 80px rgba(0,0,0,.75),
    inset 0 1px rgba(255,255,255,.1);
  animation: appear .7s ease both;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 16%;
  right: 16%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #fff, transparent);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 30px;
  background: rgba(255,255,255,.035);
  color: #d2d2d2;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #eee;
  box-shadow: 0 0 8px #aaa;
}

.logo-frame {
  position: relative;
  width: 120px;
  height: 120px;
  margin: 24px auto 19px;
  padding: 4px;
  border: 1px solid #aaa;
  border-radius: 50%;
  box-shadow:
    0 0 0 5px rgba(255,255,255,.025),
    0 0 35px rgba(255,255,255,.08);
}

.logo {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 50%;
  background: #111;
}

.brand {
  font-size: clamp(27px, 7vw, 34px);
  font-weight: 900;
  line-height: 1.35;
  letter-spacing: 1px;
  color: #eee;
  text-shadow: 0 3px 22px rgba(255,255,255,.12);
}

.brand span {
  color: #929292;
}

.divider {
  width: 65px;
  height: 2px;
  margin: 16px auto 18px;
  background: linear-gradient(90deg, transparent, #e5e5e5, transparent);
}

.headline {
  font-size: 23px;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: -.6px;
  color: #f5f5f5;
}

.headline span {
  color: #aaa;
}

.description {
  max-width: 290px;
  margin: 12px auto 0;
  color: #a3a3a3;
  font-size: 12px;
  line-height: 1.9;
  font-weight: 400;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 22px 0 20px;
}

.stat {
  padding: 13px 7px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 13px;
  background: linear-gradient(145deg, rgba(255,255,255,.05), rgba(255,255,255,.01));
}

.stat strong {
  display: block;
  color: #e7e7e7;
  font-size: 11px;
  font-weight: 700;
}

.stat small {
  display: block;
  margin-top: 6px;
  color: #858585;
  font-size: 9px;
}

.join-button {
  width: 100%;
  min-height: 57px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  padding: 13px 10px;
  border: 1px solid #fff;
  border-radius: 14px;
  background: linear-gradient(135deg, #f8f8f8, #c6c6c6 55%, #ededed);
  box-shadow: 0 8px 27px rgba(255,255,255,.09), inset 0 1px #fff;
  color: #111;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .3px;
  text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease;
}

.join-button:active {
  transform: scale(.98);
}

.join-button svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.footer {
  margin-top: 17px;
  color: #777;
  font-size: 9px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.footer strong {
  color: #ccc;
  font-weight: 700;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 360px) {
  body { padding: 10px; }
  .card { padding: 21px 16px 17px; }
  .logo-frame { width: 96px; height: 96px; margin: 18px auto 14px; }
  .headline { font-size: 20px; }
  .description { font-size: 11px; }
  .stats { margin: 16px 0; }
  .join-button { min-height: 52px; font-size: 12px; }
}

@media (max-height: 720px) {
  body { padding-top: 10px; padding-bottom: 10px; }
  .card { padding-top: 18px; padding-bottom: 15px; }
  .logo-frame { width: 84px; height: 84px; margin: 13px auto 11px; }
  .divider { margin: 10px auto 12px; }
  .description { margin-top: 7px; }
  .stats { margin: 13px 0; }
  .stat { padding: 10px 6px; }
  .footer { margin-top: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
